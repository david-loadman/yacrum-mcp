# Stages a release on npm when a release is published on GitHub (tag v<version>, matching package.json).
#
# ⛔ NO TOKEN. It authenticates with npm's TRUSTED PUBLISHING (GitHub's OIDC identity), configured on the
# package at npmjs.com → yacrum-mcp → Settings → Trusted Publisher: user `david-loadman`, repository
# `yacrum-mcp`, workflow `publish.yml`, and `npm publish` NOT allowed. Provenance is attached automatically.
#
# ⛔ IT STAGES; IT DOES NOT PUBLISH. The version goes live only when a maintainer approves it with 2FA —
# on npmjs.com, or `npm stage list` then `npm stage approve <stage-id>`. A compromised workflow can stage
# a version but never ship one. See README → Releasing.
name: Stage on npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      # ⛔ Pinned to exact commits: this job can stage a release, so the actions it runs must not change
      # under it. Bump by updating the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ⚑ No dependency cache: a release build starts clean, so a poisoned cache cannot reach what is staged.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build && npm test
      - run: npm stage publish --access public
